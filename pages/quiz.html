<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,600&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">


  <div class="quiz-card">
    <div class="quiz-header">
      <div class="paw-icon">🐾</div>
      <h1 class="quiz-title">Qual animal<br><em>você seria?</em></h1>
      <p class="quiz-subtitle">Responda com honestidade...</p>
    </div>

    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <div class="progress-label" id="progressLabel">Pergunta 1 de 5</div>

    <div class="quiz-body" id="quizBody"></div>

    <div class="quiz-result" id="quizResult"></div>
  </div>


<style>
  .leaf {
    position: absolute;
    font-size: 28px;
    opacity: 0.18;
    pointer-events: none;
    animation: sway 6s ease-in-out infinite;
    user-select: none;
  }
  .leaf-1 { top: 5%; left: 4%; font-size: 36px; animation-delay: 0s; }
  .leaf-2 { top: 12%; right: 6%; font-size: 24px; animation-delay: 1.2s; }
  .leaf-3 { bottom: 10%; left: 8%; font-size: 20px; animation-delay: 2.4s; }
  .leaf-4 { bottom: 18%; right: 4%; font-size: 32px; animation-delay: 0.8s; }
  .leaf-5 { top: 50%; left: 2%; font-size: 22px; animation-delay: 3s; }

  @keyframes sway {
    0%, 100% { transform: rotate(-8deg) translateY(0); }
    50% { transform: rotate(8deg) translateY(-10px); }
  }

  .quiz-card {
    width: 100%;
    max-width: 500px;
    background: rgba(13, 24, 13, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(100, 180, 80, 0.2);
    border-radius: 26px;
    padding: 44px 38px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.5), inset 0 1px 0 rgba(120,200,80,0.08);
    position: relative;
    z-index: 1;
  }

  .quiz-header {
    text-align: center;
    margin-bottom: 28px;
  }

  .paw-icon {
    font-size: 38px;
    display: block;
    margin-bottom: 10px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  .quiz-title {
    font-family: 'Lora', serif;
    font-size: 34px;
    font-weight: 700;
    color: #e8f0d8;
    line-height: 1.2;
    margin: 0 0 8px;
  }
  .quiz-title em {
    color: #7ec850;
    font-style: italic;
  }

  .quiz-subtitle {
    color: #4a6b40;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin: 0;
  }

  .progress-bar-track {
    background: rgba(255,255,255,0.07);
    border-radius: 99px;
    height: 5px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #4a9e2a, #7ec850);
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
    width: 0%;
  }
  .progress-label {
    font-size: 11px;
    color: #4a6b40;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 28px;
    text-align: right;
  }

  .question-block {
    opacity: 0;
    transform: translateX(30px);
    animation: slideIn 0.4s cubic-bezier(.4,0,.2,1) forwards;
  }
  @keyframes slideIn {
    to { opacity: 1; transform: translateX(0); }
  }
  .question-block.leaving {
    animation: slideOut 0.3s cubic-bezier(.4,0,.2,1) forwards;
  }
  @keyframes slideOut {
    to { opacity: 0; transform: translateX(-30px); }
  }

  .question-text {
    font-family: 'Lora', serif;
    font-size: 20px;
    color: #d8ecc0;
    margin-bottom: 18px;
    font-weight: 600;
    line-height: 1.4;
  }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
  }

  .option-btn {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(100,160,70,0.2);
    border-radius: 12px;
    color: #8aaa78;
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 12px 13px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
    line-height: 1.4;
  }
  .option-btn:hover {
    border-color: #7ec850;
    color: #d8ecc0;
    background: rgba(100,180,50,0.1);
  }
  .option-btn.selected {
    border-color: #7ec850;
    background: rgba(100,180,50,0.18);
    color: #a8e070;
    font-weight: 600;
  }

  .quiz-result {
    display: none;
    text-align: center;
    animation: slideIn 0.5s cubic-bezier(.4,0,.2,1) forwards;
  }
  .result-animal {
    font-size: 60px;
    display: block;
    margin-bottom: 12px;
    animation: float 3s ease-in-out infinite;
  }
  .result-title {
    font-family: 'Lora', serif;
    font-size: 28px;
    font-weight: 700;
    color: #7ec850;
    margin-bottom: 10px;
  }
  .result-desc {
    color: #6a9060;
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 20px;
  }
  .quiz-reset {
    background: none;
    border: 1px solid rgba(100,160,70,0.3);
    color: #4a6b40;
    font-family: 'Nunito', sans-serif;
    font-size: 12px;
    padding: 9px 22px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .quiz-reset:hover {
    border-color: #7ec850;
    color: #a8e070;
  }
</style>

<script>
  const _perguntas = [
    {
      texto: "Você se considera preguiçoso?",
      opcoes: [
        { texto: "SIMMMM SOU NICOLAS", pontos: { preguica: 3 } },
        { texto: "Depende do dia", pontos: { gato: 2 } },
        { texto: "Não, sou bem ativo!!!!!", pontos: { cachorro: 2, aguia: 1 } },
        { texto: "🚬segredo..", pontos: { hesse: 1 } },
      ]
    },
    {
      texto: "Qual palavra te define melhor?",
      opcoes: [
        { texto: "🪄 Hesse", pontos: { cachorro: 3 } },
        { texto: "🧠 Espertinho haha", pontos: { hesse: 3, aguia: 1 } },
        { texto: "😶 Solitário", pontos: { gato: 3 } },
        { texto: "🎭 Misterioso uiii", pontos: { lobo: 3 } },
      ]
    },
    {
      texto: "Como você age em grupo?",
      opcoes: [
        { texto: "Sou o líder nato", pontos: { lobo: 2, aguia: 1 } },
        { texto: "ô gente..", pontos: { gato: 1, hesse: 2 } },
        { texto: "Olho vesgo pra todo mundo", pontos: { cachorro: 2 } },
        { texto: "Prefiro estar sozinho", pontos: { preguica: 2, gato: 1 } },
      ]
    },
    {
      texto: "Qual ambiente te deixa mais feliz?",
      opcoes: [
        { texto: "🌳 Floresta densa", pontos: { preguica: 2, lobo: 1 } },
        { texto: "🏠 Em casa, no sofá", pontos: { gato: 3, preguica: 1 } },
        { texto: "🚻 Banheiro público", pontos: { cachorro: 2 } },
        { texto: "🌃 Na biqueira", pontos: { aguia: 3 } },
      ]
    },
    {
      texto: "O que você faz quando está com raiva?",
      opcoes: [
        { texto: "Vem pra briga que eu te capo", pontos: { lobo: 2 } },
        { texto: "Me afasto em silêncio", pontos: { gato: 2, hesse: 1 } },
        { texto: "Resolvo de forma esperta", pontos: { hesse: 3 } },
        { texto: "Simplesmente ignoro", pontos: { preguica: 3, cachorro: 1 } },
      ]
    },
  ];

  const _resultados={
    preguica:{emoji:"🦥", nome:"Preguiça", desc:"Calmo, tranquilebs e sábio. Você sabe que a vida não precisa de pressa — a contemplação é sua maior força."},
    cachorro:{emoji:"🐕", nome:"Cachorro", desc:"Leal, animado e cheio de amor para dar. As pessoas ao seu redor são a sua maior alegria."},
    gato: {emoji:"🐈", nome:"Gato", desc:"Independente e elegante. Você tem um mundo interno rico e só se abre com quem realmente merece." },
    hesse: {emoji:"🚬", nome:"Hesse", desc:"Fumaça no cachimbo. Você adora espirrar o lança e até que curte uma maratona de programação." },
    lobo: {emoji:"🐺", nome:"Lobo", desc:"Intenso e instintivo. Você lidera com presença e nunca abre mão dos seus valores e rosna grrr."},
    aguia: {emoji:"🦅", nome:"Águia", desc:"Visionário e livre. Você enxerga o que os outros não veem e voa mais alto que as expectativas SALVE O CORINTHIANS." },
  };

  let _currentQ =0;
  const _escolhas ={};

  function _renderPergunta(index){
    const body = document.getElementById('quizBody');
    const total = _perguntas.length;
    const q = _perguntas[index];
    document.getElementById('progressBar').style.width = `${(index / total) * 100}%`;
    document.getElementById('progressLabel').textContent = `Pergunta ${index + 1} de ${total}`;
    body.innerHTML = `
      <div class="question-block" id="qBlock">
        <div class="question-text">${q.texto}</div>
        <div class="options-grid">
          ${q.opcoes.map((o, j) => `
            <button class="option-btn" onclick="_sel(${index}, ${j}, this)">${o.texto}</button>
          `).join('')}
        </div>
      </div>
    `;
  }

  function _sel(qi, oi, btn) {
    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    _escolhas[qi] = _perguntas[qi].opcoes[oi].pontos;
    setTimeout(() => {
      const block = document.getElementById('qBlock');
      if (block) block.classList.add('leaving');
      setTimeout(() => {
        _currentQ++;
        if (_currentQ < _perguntas.length) {
          _renderPergunta(_currentQ);
        } else {
          _resultado();
        }
      }, 300);
    }, 420);
  }

  function _resultado() {
    document.getElementById('quizBody').innerHTML = '';
    document.getElementById('progressBar').style.width = '100%';
    document.getElementById('progressLabel').textContent = 'Concluído!';

    const placar = {};
    Object.values(_escolhas).forEach(pts => {
      Object.entries(pts).forEach(([animal, val]) => {
        placar[animal] = (placar[animal] || 0) + val;
      });
    });

    const vencedor = Object.entries(placar).sort((a, b) => b[1] - a[1])[0][0];
    const res = _resultados[vencedor];

    const resultDiv = document.getElementById('quizResult');
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = `
      <span class="result-animal">${res.emoji}</span>
      <div class="result-title">Você é um(a) ${res.nome}!</div>
      <p class="result-desc">${res.desc}</p>
      <button class="quiz-reset" onclick="_resetQuiz()">↩ Tentar novamente</button>
    `;
  }

  function _resetQuiz() {
    _currentQ = 0;
    Object.keys(_escolhas).forEach(k => delete _escolhas[k]);
    document.getElementById('quizResult').style.display = 'none';
    _renderPergunta(0);
    document.querySelector('.quiz-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  _renderPergunta(0);
</script>

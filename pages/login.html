        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="../src/css/all.css">
        <title>Yggdrasil - Login</title>
    </head>
    <body id="homebody">
    <header class="shadow-sm sticky-top">
        <nav class="container d-flex justify-content-between align-items-center py-3">
            <a href="home.html" class="title m-0 fs-3 text-decoration-none text-white">Yggdrasil</a>
            <div class="nav-links">
                <a href="home.html" class="text-white px-3 text-decoration-none">Home</a>
                <a href="cladograma.html" class="text-white px-3 text-decoration-none">Cladograma</a>
                <a href="#" class="text-white px-3 text-decoration-none">Sobre</a>
                <a href="#" class="text-white px-3 text-decoration-none">FAQ</a>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow-lg">
                    <div class="card-body p-5">
                        <h2 class="card-title text-center mb-4">Login</h2>
                        <form>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="seu@email.com">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="password" placeholder="Senha">
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-success btn-lg">Entrar</button>
                            </div>
                            <hr class="my-4">
                            <p class="text-center">Não tem uma conta? <a href="#">Cadastre-se</a></p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    </body>

        function showLoader() { document.getElementById('loader').style.display = 'flex'; }
        function hideLoader() { document.getElementById('loader').style.display = 'none'; }

        function parseNewick(newickString) {
            var ancestors = [];
            var tree = {};
            var tokens = newickString.split(/\s*(;|\(|\)|,|:)\s*/);
            for (var i = 0; i < tokens.length; i++) {
                var token = tokens[i];
                if (!token) continue;
                switch (token) {
                    case '(': 
                        var subtree = {};
                        tree.children = [subtree];
                        ancestors.push(tree);
                        tree = subtree;
                        break;
                    case ',': 
                        var subtree = {};
                        ancestors[ancestors.length - 1].children.push(subtree);
                        tree = subtree;
                        break;
                    case ')': 
                        tree = ancestors.pop();
                        break;
                    case ':': 
                        break;
                    default:
                        var prevToken = tokens[i - 1];
                        if (prevToken == ')' || prevToken == '(' || prevToken == ',') {
                            tree.name = token.replace(/^'|'$/g, ""); 
                        }
                }
            }
            return tree;
        }

        function formatTaxonomyTree(node, isRoot = false) {
            if (!node) return null;

            let rawName = node.name || "";
            let cleanName = rawName.replace(/_/g, " ");
            let nodeId = "";

            let match = cleanName.match(/(.+) ott(\d+)/);
            if (match) {
                cleanName = match[1].trim();
                nodeId = "ott" + match[2];
            } else if (cleanName.match(/^(ott|mrca)\d+$/)) {
                nodeId = cleanName;
            }

            let mapData = TAXON_MAP[nodeId];
            if (mapData) cleanName = mapData.name;

            const isGarbage = cleanName.toLowerCase().includes("environmental") || 
                              cleanName.toLowerCase().includes("unclassified") || 
                              cleanName.includes(" x ") || cleanName.includes("sp.");
            
            if (isGarbage || EXCLUDED_NODES.includes(nodeId) || EXCLUDED_NODES.includes(cleanName)) return null;

            const isGhost = cleanName.includes("subclass") || cleanName.includes("Deuterostomia") || cleanName.startsWith("mrca");

            let validChildren = [];
            if (node.children && Array.isArray(node.children)) {
                for (let child of node.children) {
                    let result = formatTaxonomyTree(child, false);
                    if (result) {
                        if (result.isGhost) {
                            if (result.children) validChildren.push(...result.children);
                        } else {
                            validChildren.push(result);
                        }
                    }
                }
            }

            if (isGhost) {
                return { isGhost: true, children: validChildren };
            }

            if (isRoot) {
                cleanName = "Mamíferos";
                validChildren = validChildren.filter(c => ["Theria", "Prototheria"].includes(c.name));
            }

            validChildren.sort((a, b) => (b.isMajor ? 1 : 0) - (a.isMajor ? 1 : 0));

            return {
                id: nodeId, 
                name: cleanName,
                rank: mapData ? (mapData.rank || "desconhecido") : "desconhecido",
                isMajor: isRoot || !!mapData,
                children: validChildren.length > 0 ? validChildren : undefined
            };
        }

        async function loadData() {
            showLoader();
            try {
                let rootData = {
                    id: "ott244265", name: "Mamíferos", rank: "classe", isMajor: true,
                    _childrenCarregados: true,

        function updateSearchSuggestions() {
            if (!globalRoot) return;
            const datalist = document.getElementById('taxons-list');
            const nodes = globalRoot.descendants();
            const names = [...new Set(nodes.map(d => d.data.name))].sort();
            
            let optionsHTML = names.map(name => `<option value="${name}">`).join('');
            for (let apelido in DICIONARIO_POPULAR) {
                optionsHTML += `<option value="${apelido}">`;
            }
            datalist.innerHTML = optionsHTML;
        }

        async function carregarFilhosDaAPI(d) {
            if (d.data._childrenCarregados) return true;

            if (d.data.name === "Homo") {
                let childNode = d3.hierarchy({
                    id: "ott770315", 
                    name: "Homo sapiens",
                    rank: "species",
                    isMajor: true,
                    _childrenCarregados: true 
                });
                childNode.depth = d.depth + 1;
                childNode.parent = d;
                
                d.children = [childNode];
                d.data._childrenCarregados = true;
                updateSearchSuggestions();
                globalUpdate(d);
                return true;
            }

            showLoader();
            let ottId = parseInt(d.data.id.replace("ott", ""));

            try {
                const response = await fetch('https://api.opentreeoflife.org/v3/taxonomy/taxon_info', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ "ott_id": ottId, "include_children": true })
                });

                if (!response.ok) throw new Error("Erro na API");

                const taxonInfo = await response.json();

                if (taxonInfo.children && taxonInfo.children.length > 0) {
                    const validChildren = taxonInfo.children.filter(child => {
                        let childOtt = "ott" + child.ott_id;
                        let cName = child.name.toLowerCase();
                        
                        let isExtinct = child.flags && child.flags.includes("extinct");
                        let isGarbage = cName.includes("environmental") || cName.includes("unclassified") || cName.includes(" x ") || cName.includes("sp.");
                        
                        return !isGarbage && !isExtinct && !EXCLUDED_NODES.includes(childOtt) && !EXCLUDED_NODES.includes(child.name);
                    });

                    const promessasWiki = validChildren.map(async (child) => {
                        let rankDoFilho = child.rank ? child.rank.toLowerCase() : "desconhecido";
                        
                        if (rankDoFilho.includes("class") || rankDoFilho.includes("ord")) {
                            return child;
                        }

                        try {
                            let nomeBusca = WIKI_OVERRIDES[child.name] || child.name;
                            nomeBusca = nomeBusca.replace(/ /g, "_");
                            let wikiResp = await fetch(`https://pt.wikipedia.org/api/rest_v1/page/summary/${nomeBusca}`);
                            if (wikiResp.ok) {
                                let wikiData = await wikiResp.json();
                                if (wikiData.type !== "no-summary") return child; 
                            }
                        } catch (e) { 
                            return child; 
                        }
                        return null; 
                    });

                    const resultados = await Promise.all(promessasWiki);
                    const sobreviventesDaWiki = resultados.filter(c => c !== null);

                    if (sobreviventesDaWiki.length > 0) {
                        const newChildren = sobreviventesDaWiki.map(child => {
                            let childOtt = "ott" + child.ott_id;
                            let mapData = TAXON_MAP[childOtt]; 
                            let rankFinal = mapData ? mapData.rank : (child.rank || "desconhecido");
                            let ehEspecie = (rankFinal.toLowerCase().includes("species") || rankFinal.toLowerCase().includes("especie"));

                            let childNode = d3.hierarchy({
                                id: childOtt,
                                name: mapData ? mapData.name : child.name,
                                rank: rankFinal,
                                isMajor: !!mapData,
                                _childrenCarregados: ehEspecie
                            });
                            childNode.depth = d.depth + 1;
                            childNode.parent = d;
                            return childNode;
                        });

                        d.children = newChildren;
                        d.data._childrenCarregados = true; 
                        updateSearchSuggestions();
                        return true;
                    } else {
                        d.data._childrenCarregados = true; 
                        return false;
                    }
                } else {
                    d.data._childrenCarregados = true; 
                    return false;
                }
            } catch (error) {
                console.error(error); return false;
            } finally {
                hideLoader();
                globalUpdate(d);
            }
        }

        function renderTree(data) {
            let i = 0;
            const duration = 750;
            const tooltip = d3.select("#tooltip");
            let hideTimeout;

            globalRoot = d3.hierarchy(data);
            globalRoot.x0 = width / 2;
            globalRoot.y0 = 0;

            function collapse(d) {
                if (d.children) { 
                    d._children = d.children; 
                    d._children.forEach(collapse); 
                    d.children = null; 
                }
            }

            if (globalRoot.children) {
                globalRoot.children.forEach(child => {
                    if (child.children) {
                        child.children.forEach(collapse); 
                        child._children = child.children;
                        child.children = null; 
                    }
                });
            }

            globalUpdate = function update(source) {
                const treeLayout = d3.tree().nodeSize([180, 280]);
                const treeData = treeLayout(globalRoot);
                const nodes = treeData.descendants();
                const links = treeData.links();
                
                const hideTooltip = () => {
                    hideTimeout = setTimeout(() => { d3.select("#tooltip").style("display", "none"); }, 300);
                };

                function getNodeColor(d) {
                    let rank = d.data.rank ? d.data.rank.toLowerCase() : "";
                    
                    // NÍVEL 1: Acima de Classe, se houver Reino, Filo...
                    if (rank.includes("domain") || rank.includes("king") || rank.includes("rein") || rank.includes("phyl") || rank.includes("filo")) return "#4a148c";
                    
                    // NÍVEL 2: Classes 
                    if (rank.includes("subclass") || rank.includes("infraclass") || rank.includes("parvclass") || rank.includes("superclass")) return "#c62828"; 
                    if (rank === "class" || rank === "classe") return "#6d4c41"; 
                    
                    // NÍVEL 3: Clados Estruturais e Coortes
                    if (rank.includes("clade") || rank.includes("clado") || rank.includes("cohort") || rank.includes("coort") || rank.includes("legion") || rank.includes("legiã")) return "#d84315";
                    
                    // NÍVEL 4: Ordens 
                    if (rank.includes("magnord") || rank.includes("superord") || rank.includes("grandord") || rank.includes("mirord")) return "#e65100"; 
                    if (rank === "order" || rank === "ordem") return "#f57c00"; 
                    if (rank.includes("subord") || rank.includes("infraord") || rank.includes("parvord")) return "#ff9800"; 
                    
                    // NÍVEL 5: Famílias 
                    if (rank.includes("superfam") || rank.includes("epifam")) return "#ffb300"; 
                    if (rank === "family" || rank === "familia" || rank === "família") return "#fbc02d"; 
                    if (rank.includes("subfam") || rank.includes("infrafam")) return "#ffee58"; 
                    
                    // NÍVEL 6: Tribos 
                    if (rank.includes("trib")) return "#d4e157"; 
                    
                    // NÍVEL 7: Gêneros 
                    if (rank === "genus" || rank === "genero" || rank === "gênero") return "#9ccc65"; 
                    if (rank.includes("gen") || rank.includes("gên")) return "#7cb342"; 
                    
                    // NÍVEL 8: Espécies 
                    if (rank.includes("spec") || rank.includes("espéc") || rank.includes("subsp") || rank.includes("var") || rank.includes("form")) return "#388e3c";
                    
                    // NÍVEL 9: Nós sem Rank 
                    return "#5d4037"; 
                }

                d3.select("#tooltip")
                    .on('mouseenter', () => clearTimeout(hideTimeout))
                    .on('mouseleave', hideTooltip);

                nodes.forEach(d => { d.y = d.depth * 250 });

                const node = g.selectAll('g.node')
                    .data(nodes, d => d.id || (d.id = ++i));

                const nodeEnter = node.enter().append('g')
                    .attr('class', 'node')
                    .attr('transform', d => `translate(${source.x0},${source.y0})`)
                    .on('click', async (event, d) => {
                        document.getElementById('btn-recolher').removeAttribute('disabled');
                        if (d.children) { 
                            d._children = d.children; d.children = null; globalUpdate(d); return;
                        } 
                        if (d._children) {
                            d.children = d._children; d._children = null; globalUpdate(d); return;
                        }

                        if (!d.data.id || !d.data.id.startsWith("ott")) {
                            alert("ID inválido."); return;
                        }

                        let sucesso = await carregarFilhosDaAPI(d);
                        if (!sucesso && !d.data._childrenCarregados) alert("Não foi possível carregar mais ramificações.");
                    })

                    .on('dblclick', (event, d) => {
                        event.stopPropagation(); 
                        const scale = 1.3;
                        const tx = width / 2 - d.x * scale;
                        const ty = height / 2 - d.y * scale;
                        
                        d3.select("svg").transition().duration(800).call(
                            zoomBehavior.transform, 
                            d3.zoomIdentity.translate(tx, ty).scale(scale)
                        );
                    })
                    .on('mouseenter', async (event, d) => {
                        clearTimeout(hideTimeout);
                        tooltip.style("display", "block")
                            .style("left", (event.pageX + 15) + "px")
                            .style("top", (event.pageY - 20) + "px")
                            .html("<em>Carregando...</em>");

                        try {
                            let nomeBusca = WIKI_OVERRIDES[d.data.name] || d.data.name;
                            const response = await fetch(`https://pt.wikipedia.org/api/rest_v1/page/summary/${nomeBusca}`);
                            const wikiData = await response.json();
                            
                            const idTag = `<hr style="margin: 8px 0; border-color: #f56a00;"><div style="text-align: center; font-size: 0.8rem; color: #ffeb3b;">ID do Nó: <b>${d.data.id || "Sem ID"}</b></div>`;
                            
                            if (wikiData.title && wikiData.type !== "no-summary") {
                                tooltip.html(`
                                    ${wikiData.thumbnail ? `<img src="${wikiData.thumbnail.source}">` : ''}
                                    <h3>${wikiData.title}</h3>
                                    <p>${wikiData.extract}</p>
                                    <a class="wiki-link" href="${wikiData.content_urls.desktop.page}" target="_blank">Ver na Wikipedia →</a>
                                    ${idTag}
                                `);
                            } else {
                                tooltip.html(`<h3>${d.data.name}</h3><p>Resumo não encontrado na Wikipedia.</p>${idTag}`);
                            }
                        } catch (err) { 
                            tooltip.html(`Erro ao carregar dados.<br><hr style="margin: 8px 0; border-color: #f56a00;"><div style="text-align: center; font-size: 0.8rem; color: #ffeb3b;">ID do Nó: <b>${d.data.id || "Sem ID"}</b></div>`); 
                        }
                    })
                nodeEnter.append('rect')
                    .attr('width', 140).attr('height', 35).attr('x', -70).attr('y', -17).attr('rx', 5)
                    .attr('fill', getNodeColor) 
                    .attr('stroke', d => d.data._childrenCarregados === false ? "#ffffff" : colorScale(d.depth))
                    .attr('stroke-width', d => d.data._childrenCarregados === false ? 2.5 : 1);

                nodeEnter.append('text')
                    .attr('dy', 5).attr('text-anchor', 'middle')
                    .attr('fill', d => {
                        let rank = d.data.rank ? d.data.rank.toLowerCase() : "";
                        
                        const fundosClaros = ['fam', 'trib', 'gen', 'gên', 'subord', 'infraord', 'parvord'];
                        if (fundosClaros.some(termo => rank.includes(termo))) return '#000000';
                        
                        return '#ffffff';
                    })
                    .style('font-size', '12px').style('font-weight', 'bold')
                    .text(d => d.data.name);

                const nodeUpdate = nodeEnter.merge(node);
                nodeUpdate.transition().duration(duration).attr('transform', d => `translate(${d.x},${d.y})`);
                
                nodeUpdate.select('rect')
                    .attr('fill', getNodeColor)
                    .attr('stroke', d => d.data._childrenCarregados === false ? "#ffffff" : colorScale(d.depth))
                    .attr('stroke-width', d => d.data._childrenCarregados === false ? 2.5 : 1);

                const link = g.selectAll('path.link').data(links, d => d.target.id);
                const linkEnter = link.enter().insert('path', 'g')
                    .attr('class', 'link').attr('stroke', d => colorScale(d.source.depth))
                    .attr('d', d3.linkVertical().x(d => source.x0).y(d => source.y0));

                linkEnter.merge(link).transition().duration(duration)
                    .attr('d', d3.linkVertical().x(d => d.x).y(d => d.y));

                node.exit().transition().duration(duration).attr('transform', d => `translate(${source.x},${source.y})`).remove();
                link.exit().transition().duration(duration).attr('d', d3.linkVertical().x(d => source.x).y(d => source.y)).remove();

                nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
            };

            globalUpdate(globalRoot);
        }

        function recolherTudo() {
            if (!globalRoot) return;

            function fecharGavetas(d) {
                    if (d.children) {
                        d._children = d.children;
                        d._children.forEach(fecharGavetas);
                        d.children = null;
                    } else if (d._children) {
                        d._children.forEach(fecharGavetas);
                    }
                }

                if (globalRoot.children) {
                    globalRoot.children.forEach(fecharGavetas);
                } else if (globalRoot._children) {
                    globalRoot.children = globalRoot._children;
                    globalRoot._children = null;
                    globalRoot.children.forEach(fecharGavetas);
                }

                globalUpdate(globalRoot);
                
                if (typeof voltarParaRaiz === "function") {
                    voltarParaRaiz();
                }
                
                document.getElementById('btn-recolher').setAttribute('disabled', 'true');
            }

        async function searchNode() {
            let term = document.getElementById('search-input').value.toLowerCase().trim();
            if (!term || !globalRoot) return;
            if (DICIONARIO_POPULAR[term]) term = DICIONARIO_POPULAR[term].toLowerCase();

            showLoader();
            document.querySelector("#loader p").innerText = "Buscando...";

            try {
                const tnrsResp = await fetch('https://api.opentreeoflife.org/v3/tnrs/match_names', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ names: [term] })
                });
                const tnrsData = await tnrsResp.json();

                if (!tnrsData.results || tnrsData.results.length === 0 || tnrsData.results[0].matches.length === 0) {
                    alert("Táxon não encontrado no banco de dados da API."); hideLoader(); return;
                }
                const targetOttId = tnrsData.results[0].matches[0].taxon.ott_id;

                const taxResp = await fetch('https://api.opentreeoflife.org/v3/taxonomy/taxon_info', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ott_id: targetOttId, include_lineage: true })
                });
                const taxData = await taxResp.json();
                if (!taxData.lineage) { alert("Não foi possível traçar a rota."); hideLoader(); return; }

                const caminho = taxData.lineage.map(l => "ott" + l.ott_id).reverse();
                caminho.push("ott" + targetOttId);

                let atual = globalRoot;
                for (let i = 0; i < caminho.length; i++) {
                    let passoId = caminho[i];
                    if (passoId === "ott244265") continue; 

                    if (!atual.data._childrenCarregados) {
                        await carregarFilhosDaAPI(atual);
                    } else if (atual._children) {
                        atual.children = atual._children; atual._children = null;
                    }

                    if (atual.children) {
                        let proximo = atual.children.find(c => c.data.id === passoId);
                        if (proximo) atual = proximo;
                    }
                }

                globalUpdate(globalRoot);
                d3.selectAll('.link').classed('link-highlight', false);

                const ancestors = atual.ancestors().reverse();
                ancestors.forEach((node, idx) => {
                    if (idx === 0) return;
                    setTimeout(() => {
                        d3.selectAll('.link').filter(l => l.target.id === node.id).classed('link-highlight', true);
                    }, idx * 150);
                });

                setTimeout(() => {
                    const scale = 1.2;
                    const tx = width / 2 - atual.x * scale;
                    const ty = height / 2 - atual.y * scale;
                    d3.select("svg").transition().duration(1000).call(zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
                }, 200);

            } catch (error) {
                console.error(error); alert("Erro durante a busca teleguiada.");
            } finally {
                document.querySelector("#loader p").innerText = "Tecendo os galhos da Yggdrasil...";
                hideLoader();
            }
        }

        document.getElementById('search-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') searchNode(); });
        function zoomIn() {
            d3.select("svg").transition().duration(300).call(zoomBehavior.scaleBy, 1.3);
        }

        function zoomOut() {
            d3.select("svg").transition().duration(300).call(zoomBehavior.scaleBy, 1 / 1.3);
        }

        function voltarParaRaiz() {
            if (!globalRoot) return;
            const scale = 1;
            const tx = width / 2 - globalRoot.x * scale;
            const ty = 80 - globalRoot.y * scale; 
            
            d3.select("svg").transition().duration(1000).call(
                zoomBehavior.transform, 
                d3.zoomIdentity.translate(tx, ty).scale(scale)
            );
        }   

        function buscarAnimalAleatorio() {
            document.getElementById('btn-recolher').removeAttribute('disabled');
            
            const especies = [
                "Panthera leo", /* Leão */
                "Panthera tigris", /* Tigre */
                "Felis catus", /* Gato */
                "Canis lupus familiaris", /* Cachorro */
                "Panthera onca", /* Onça-pintada */
                "Acinonyx jubatus", /* Guepardo */
                "Homo sapiens", /* Humano */
                "Ursus maritimus", /* Urso-polar */
                "Ailuropoda melanoleuca", /* Panda-gigante */
                "Hippopotamus amphibius", /* Hipopótamo */
                "Giraffa camelopardalis", /* Girafa */
                "Bos taurus", /* Vaca */
                "Sus scrofa", /* Javali */
                "Mus musculus", /* Camundongo */
                "Hydrochoerus hydrochaeris", /* Capivara */
                "Orcinus orca", /* Orca */
                "Phascolarctos cinereus", /* Coala */
                "Ornithorhynchus anatinus", /* Ornitorrinco */
                "Gorilla gorilla", /* Gorila */
                "Pan troglodytes", /* Chimpanzé */
                "Pongo pygmaeus", /* Orangotango */
                "Loxodonta africana", /* Elefante-africano */
                "Equus caballus", /* Cavalo */
                "Balaenoptera musculus", /* Baleia-azul */
                "Bradypus tridactylus" /* Preguiça-de-três-dedos */
            ];

            const animalAleatorio = especies[Math.floor(Math.random() * especies.length)];

            let nomeParaMostrar = animalAleatorio;
            for (let apelido in DICIONARIO_POPULAR) {
                if (DICIONARIO_POPULAR[apelido] === animalAleatorio) {
                    nomeParaMostrar = apelido.charAt(0).toUpperCase() + apelido.slice(1);
                    break;
                }
            }

            document.getElementById('search-input').value = nomeParaMostrar;
            searchNode();
        }

        function toggleTema() {
            document.body.classList.toggle('tema-claro');
        }   

        function getExemploLocal() {
            return {
                name: "Mamíferos OFFLINE", rank: "classe",
                children: [
                    { name: "Monotremata", rank: "ordem", children: [{ name: "Ornithorhynchidae", rank: "familia" , children: [{ name: "Ornithorhynchus anatinus", rank: "especie" }]}] },
                    { name: "Theria", rank: "infraclasse", children: [
                        { name: "Marsupialia", rank: "infraclasse", children: [{ name: "Didelphimorphia", rank: "ordem" }] },
                        { name: "Placentalia", rank: "infraclasse", children: [{ name: "Primates", rank: "ordem" , children: [{ name: "Lemuriformes", rank: "familia"}]}] }
                    ]}
                ]
            };
        }

        loadData();
    </script>

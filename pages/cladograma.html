<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yggdrasil - Mammalia</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../src/css/all.css">
    <link rel="stylesheet" href="../src/css/cladograma.css">

    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <header>
        <div class="row g-0 align-items-center d-flex">
            <h1 class="col-sm-6">Yggdrasil</h1>
            <h2 class="col-sm-2">Cladograma</h2>
            <h2 class="col-sm-2">Sobre</h2>
            <h2 class="col-sm-2">FAQ</h2>
        </div>
    </header>

    <main>
        <div id="tree-container"></div>
    </main>

    <script>
        const width = window.innerWidth;
        const height = window.innerHeight * 1.5;

        const svg = d3.select("#tree-container")
            .append("svg")
            .attr("width", "100%")
            .attr("height", "100%")
            .call(d3.zoom().scaleExtent([0.1, 5]).on("zoom", (event) => {
                g.attr("transform", event.transform);
            }))
            .append("g");

        const g = svg.append("g");

        // Escala de cores (Amarelo para Vermelho) baseada na profundidade
        const colorScale = d3.scaleSequential(d3.interpolateYlOrRd).domain([5, 0]);

        async function loadData() {
            const apiURL = 'https://www.onezoom.org/OZ_API.php?action=get_json&ott_id=306454&max_depth=2';
            const proxyURL = `https://api.allorigins.win/get?url=${encodeURIComponent(apiURL)}`;

            try {
                const response = await fetch(proxyURL);
                if (!response.ok) throw new Error("Erro na rede");
                
                const wrapper = await response.json();
                const data = JSON.parse(wrapper.contents);

                const formatData = (obj) => {
                    if (obj.child) {
                        obj.children = obj.child;
                        delete obj.child;
                        obj.children.forEach(formatData);
                    }
                    obj.name = obj.n || obj.scientific_name || obj.name || "Taxon";
                };

                formatData(data);
                renderTree(data);
            } catch (error) {
                console.warn("Usando dados locais de fallback devido a erro na API.");
                renderTree(getExemploLocal());
            }
        }

        function renderTree(data) {
            // Limpa o SVG antes de renderizar (caso haja erro e precise recarregar)
            g.selectAll("*").remove();

            const root = d3.hierarchy(data);
            const treeLayout = d3.tree().size([width - 100, height - 200]);
            treeLayout(root);

            // Desenha as linhas (Links) com as cores da foto
            g.selectAll(".link")
                .data(root.links())
                .join("path")
                .attr("class", "link")
                .attr("stroke", d => colorScale(d.source.depth))
                .attr("d", d3.linkVertical()
                    .x(d => d.x)
                    .y(d => d.y));

            // Cria os nós (Gerais)
            const node = g.selectAll(".node")
                .data(root.descendants())
                .join("g")
                .attr("class", "node")
                .attr("transform", d => `translate(${d.x},${d.y})`)
                .on("click", (event, d) => {
                    const term = d.data.name.replace(" ", "_");
                    window.open(`https://pt.wikipedia.org/wiki/${term}`, '_blank');
                });

            // Retângulos (Caixas dos nomes)
            node.append("rect")
                .attr("width", 120)
                .attr("height", 30)
                .attr("x", -60)
                .attr("y", -15)
                .attr("fill", d => d3.color(colorScale(d.depth)).darker(1.5))
                .attr("stroke", d => colorScale(d.depth));

            // Texto
            node.append("text")
                .attr("dy", 5)
                .attr("text-anchor", "middle")
                .text(d => d.data.name);
        }

        // Função que faltava para o código não dar erro
        function getExemploLocal() {
            return {
                name: "Mammalia",
                children: [
                    {
                        name: "Monotremata",
                        children: [{ name: "Ornithorhynchidae" }, { name: "Tachyglossidae" }]
                    },
                    {
                        name: "Theria",
                        children: [
                            { 
                                name: "Marsupialia", 
                                children: [{ name: "Didelphimorphia" }, { name: "Diprotodontia" }] 
                            },
                            { 
                                name: "Placentalia", 
                                children: [
                                    { name: "Rodentia" },
                                    { name: "Primates" },
                                    { name: "Carnivora" },
                                    { name: "Cetartiodactyla" }
                                ] 
                            }
                        ]
                    }
                ]
            };
        }

        loadData();
    </script>
</body>
</html>
